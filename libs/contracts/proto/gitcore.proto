syntax = "proto3";

package singularitree.v1;

import "domain.proto";

option go_package = "github.com/SingulariTree/go-core/gen/go/singularitree/v1;singularitreev1";

// Service GitCore — primary gRPC contract (ipc-strategy.md §2.3 proto sketch)
service GitCore {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc OpenRepository(OpenRepositoryRequest) returns (Repository);
  rpc GetRepository(GetRepositoryRequest) returns (Repository);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc GetCommits(GetCommitsRequest) returns (GetCommitsResponse);
  // Root-qualified to disambiguate from the `Commit` service method (which would
  // otherwise shadow the message of the same name in this service's scope).
  rpc StreamCommits(StreamCommitsRequest) returns (stream .singularitree.v1.Commit);
  rpc GetBranches(GetBranchesRequest) returns (GetBranchesResponse);
  rpc GetRemotes(GetRemotesRequest) returns (GetRemotesResponse);
  rpc GetTags(GetTagsRequest) returns (GetTagsResponse);
  rpc GetStashes(GetStashesRequest) returns (GetStashesResponse);
  rpc GetWorktrees(GetWorktreesRequest) returns (GetWorktreesResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetDiff(GetDiffRequest) returns (Diff);
  rpc Stage(StageRequest) returns (StageResponse);
  rpc Unstage(UnstageRequest) returns (UnstageResponse);
  rpc Commit(CommitRequest) returns (.singularitree.v1.Commit);
  rpc Checkout(CheckoutRequest) returns (CheckoutResponse);
  rpc Fetch(FetchRequest) returns (stream Progress);
  rpc Push(PushRequest) returns (stream Progress);
  rpc Pull(PullRequest) returns (stream Progress);
  rpc Watch(WatchRequest) returns (stream FsChangedEvent);
}

// Health
message PingRequest {}
message PingResponse {
  bool ok = 1;
  uint64 uptime_ms = 2;
  uint32 queue_depth = 3;
}

// Repository
message OpenRepositoryRequest { string fs_path = 1; }
message GetRepositoryRequest { string repo_id = 1; }
message ListRepositoriesRequest {}
message ListRepositoriesResponse { repeated Repository repositories = 1; }

// Commits (windowed + streaming)
message GetCommitsRequest {
  string repo_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;
}
message GetCommitsResponse {
  repeated Commit commits = 1;
  uint32 total = 2;
  // Parallel-array contract: lanes is index-aligned with commits, i.e.
  // lanes[i] is the lane assignment for commits[i]; both arrays share length.
  repeated Lane lanes = 3; // parallel to `commits`: lanes[i] belongs to commits[i]
}
message StreamCommitsRequest {
  string repo_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;
}

// Branches / remotes / tags / stashes / worktrees
message GetBranchesRequest { string repo_id = 1; }
message GetBranchesResponse { repeated Branch branches = 1; }

message GetRemotesRequest { string repo_id = 1; }
message GetRemotesResponse { repeated Remote remotes = 1; }

message GetTagsRequest { string repo_id = 1; }
message GetTagsResponse { repeated Tag tags = 1; }

message GetStashesRequest { string repo_id = 1; }
message GetStashesResponse { repeated Stash stashes = 1; }

message GetWorktreesRequest { string repo_id = 1; }
message GetWorktreesResponse { repeated Worktree worktrees = 1; }

// Status & diff
message GetStatusRequest { string repo_id = 1; }
message GetStatusResponse { repeated FileStatus files = 1; }

message GetDiffRequest {
  string repo_id = 1;
  string from = 2; // Oid hex
  string to = 3;   // Oid hex
}

// Stage
message StageRequest {
  string repo_id = 1;
  repeated string paths = 2;
}
message StageResponse {}

message UnstageRequest {
  string repo_id = 1;
  repeated string paths = 2;
}
message UnstageResponse {}

// Commit
message CommitRequest {
  string repo_id = 1;
  string message = 2;
  Signature author = 3; // optional override
}
message CheckoutRequest {
  string repo_id = 1;
  string ref_name = 2;
}
message CheckoutResponse {}

// Fetch / Push / Pull with progress streaming.
//
// The additive fields below un-defer previously-deferred dialog options; each
// maps to the named git flag. Field numbers on the original messages are frozen
// (ADR-003); only new numbers are appended.
message FetchRequest {
  string repo_id = 1;
  string remote = 2;
  // Previously-deferred `fetch.prune` — map to `git fetch --prune`.
  bool prune = 3;
  // Previously-deferred `fetch.tags` — map to `git fetch --tags`.
  bool tags = 4;
  // Previously-deferred `fetch.overwriteTags` — map to `git fetch --force` (updates moved tags).
  bool force = 5;
}
message PushRequest {
  string repo_id = 1;
  string remote = 2;
  string branch = 3;
  // Previously-deferred `push.remoteBranch` — target remote branch name when it
  // differs from the local branch. Chosen over a free-form refspec so the core
  // controls the mapping and rejects unsafe values; maps to `git push <remote>
  // <branch>:<remote_branch>`. Empty means "same name as <branch>".
  string remote_branch = 4;
  // Previously-deferred `push.track` — map to `git push --set-upstream`.
  bool set_upstream = 5;
  // Previously-deferred `push.tags` — map to `git push --tags`.
  bool tags = 6;
  // Previously-deferred `push.force` — map to `git push --force`.
  bool force = 7;
}
message PullRequest {
  string repo_id = 1;
  string remote = 2;
  string branch = 3;
  // Previously-deferred `pull.intoLocal` — local branch to fast-forward/merge
  // into; maps to `git pull <remote> <branch>:<local_branch>`. Empty means the
  // currently checked-out branch.
  string local_branch = 4;
  // Previously-deferred `pull.commitMerged` — when true, do not commit the merge
  // (maps to `git pull --no-commit`).
  bool no_commit = 5;
  // Previously-deferred `pull.includeMergedMessages` — map to `git pull --log`.
  bool log = 6;
  // Previously-deferred `pull.noFF` — map to `git pull --no-ff`.
  bool no_ff = 7;
  // Previously-deferred `pull.rebase` — map to `git pull --rebase`.
  bool rebase = 8;
}
message Progress {
  uint32 percent = 1;
  string message = 2;
}

// Watcher push
message WatchRequest { string repo_id = 1; }
message FsChangedEvent {
  string repo_id = 1;
  repeated string paths = 2;
}
