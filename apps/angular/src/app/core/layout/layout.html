<div class="st-shell">
  <st-shell-header [tabs]="[]" />

  <st-shell-menubar
    [leftCollapsed]="leftCollapsed()"
    [rightCollapsed]="rightCollapsed()"
    (toggleLeft)="toggleLeft()"
    (toggleRight)="toggleRight()"
  />

  <st-shell-toolbar />

  <!-- BODY: left | center | right -->
  <div class="st-body">
    <st-sidebar-left
      [collapsed]="leftCollapsed()"
      [activeWorkspace]="activeWorkspace()"
      [branches]="[]"
      [tags]="[]"
      [remotes]="[]"
      (collapseToggle)="toggleLeft()"
      (workspaceSelected)="activeWorkspace.set($event)"
    />

    <!-- CENTER: always route-driven -->
    <div class="st-center">
      <div class="st-router-host">
        <router-outlet />
      </div>
    </div>

    <!-- RIGHT DRAWER -->
    <st-repo-drawer
      [repos]="repoCards()"
      [collapsed]="rightCollapsed()"
      [overlay]="isOverlay()"
      [pinned]="rightPinned()"
      [width]="isOverlay() || rightCollapsed() ? null : rightWidth()"
      [loading]="gh.loading()"
      [offline]="gh.offline()"
      [authenticated]="gh.authenticated()"
      [error]="gh.error()"
      (toggleRight)="toggleRight()"
      (togglePin)="togglePin()"
      (resizeStart)="onDragStart($event)"
    />
  </div>
  <!-- /st-body -->

  <!-- backdrop for overlay mode -->
  @if (isOverlay() && !rightCollapsed()) {
    <div class="st-backdrop" (click)="closeOverlay()"></div>
  }

  <!-- collapsed right peek button (desktop) -->
  @if (!isOverlay() && rightCollapsed()) {
    <button class="st-right-peek" type="button" (click)="toggleRight()" title="Show repositories">
      ›
    </button>
  }
</div>
